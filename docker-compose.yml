services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    restart: always
    environment:
      POSTGRES_DB: zerodha_trading
      POSTGRES_PASSWORD: trading_password
      POSTGRES_USER: postgres
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    volumes:
      - ./.env:/app/.env
    environment:
      - TZ=Asia/Kolkata
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=trading_password
      - DB_NAME=zerodha_trading
      - GODEBUG=netdns=go   # Forces the Go native resolver
      - DB_SSL_MODE=disable
      - KITE_API_KEY=${KITE_API_KEY}
      - KITE_API_SECRET=${KITE_API_SECRET}
      - KITE_USER_ID=${KITE_USER_ID}
      - KITE_ACCESS_TOKEN=${KITE_ACCESS_TOKEN}
      - KITE_TOKEN_PREFIX=${KITE_TOKEN_PREFIX:-vj:zt-ut:}
      - KITE_REDIRECT_URL=${KITE_REDIRECT_URL}
      - AWS_HOST_IP=${AWS_HOST_IP}
      - BROAD_SUBSCRIBE=${BROAD_SUBSCRIBE:-true}
      - MORNING_BROAD_AGG_START=${MORNING_BROAD_AGG_START:-09:15}
      - MORNING_BROAD_AGG_END=${MORNING_BROAD_AGG_END:-09:45}
      - BOT_RESTART_ALLOWED_BEFORE=${BOT_RESTART_ALLOWED_BEFORE:-09:15}
      - BOT_RESTART_ALLOWED_AFTER=${BOT_RESTART_ALLOWED_AFTER:-15:45}
      - OPTIONS_LIMIT_BUFFER_PCT=${OPTIONS_LIMIT_BUFFER_PCT:-5.0}
      - OPTIONS_TRAIL_SL_BUFFER_PCT=${OPTIONS_TRAIL_SL_BUFFER_PCT:-5.0}
      - OPTIONS_MAX_TRADES_PER_DAY=${OPTIONS_MAX_TRADES_PER_DAY:-10}
      - LV_CANDLE_TIMEFRAME=${LV_CANDLE_TIMEFRAME:-5m}
      - VB_CANDLE_TIMEFRAME=${VB_CANDLE_TIMEFRAME:-1m}
      - FB_CANDLE_TIMEFRAME=${FB_CANDLE_TIMEFRAME:-1m}
      - VBT_CANDLE_TIMEFRAME=${VBT_CANDLE_TIMEFRAME:-1m}
      - ES5_CANDLE_TIMEFRAME=${ES5_CANDLE_TIMEFRAME:-1m}
      - ES5_EMA_TOUCH_BUFFER_PCT=${ES5_EMA_TOUCH_BUFFER_PCT:-0.10}
      - ES5_MASTER_MAX_WICK_PCT=${ES5_MASTER_MAX_WICK_PCT:-40.0}
      - MANUAL_TRADE_SYNC_ENABLED=${MANUAL_TRADE_SYNC_ENABLED:-true}
      - MANUAL_TRADE_POLL_MINUTES=${MANUAL_TRADE_POLL_MINUTES:-5}
      - MANUAL_TRADE_ATTACHED_RR_STRATEGY=${MANUAL_TRADE_ATTACHED_RR_STRATEGY:-PARTIAL_BOOK_COST_SL}
      - MANUAL_TRADE_RR_RATIO=${MANUAL_TRADE_RR_RATIO:-2.0}
      - MANUAL_TRADE_PARTIAL_EXIT_PCT=${MANUAL_TRADE_PARTIAL_EXIT_PCT:-50.0}
      - MANUAL_TRADE_DEFAULT_SL_PCT=${MANUAL_TRADE_DEFAULT_SL_PCT:-1.5}
      - MANUAL_TRADE_MOVE_SL_TO_COST=${MANUAL_TRADE_MOVE_SL_TO_COST:-true}
      - MANUAL_TRADE_COST_BUFFER_PCT=${MANUAL_TRADE_COST_BUFFER_PCT:-0.05}
      - MANUAL_TRADE_USE_BROKER_SL=${MANUAL_TRADE_USE_BROKER_SL:-true}
      - RISK_PER_TRADE=${RISK_PER_TRADE:-500.0}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
