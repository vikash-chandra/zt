<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login to Vridhi — Algorithmic Trading Platform</title>
    <link rel="icon" type="image/jpeg" href="/branding/vridhi_favicon.jpg?v=4">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #F8F9FA;
            --header-bg: linear-gradient(90deg, #162235 0%, #0F1826 100%);
            --header-border: #E5A93B;
            --footer-bg: #090E17;
            --card-bg: #FFFFFF;
            --card-border: #E2E8F0;
            --text-card-title: #1E293B;
            --text-card-body: #475569;
            --text-card-muted: #64748B;
            --input-border: #CBD5E1;
            --input-border-focus: #FF5722;
            --btn-orange: #FF5722;
            --btn-orange-hover: #E04A1B;
            --btn-orange-active: #C93B10;
            --color-up: #089981;
            --error-bg: #FDEEED;
            --error-border: #F5C6CB;
            --error-text: #B71C1C;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            min-height: 100%;
        }

        /* Non-sticky, smooth native pull-to-refresh for Chrome mobile */
        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background-color: var(--bg-page);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: auto;
        }

        /* 100% Symmetric Header Matching index.html */
        .workspace-header {
            position: sticky;
            top: 0;
            z-index: 100;
            height: 48px;
            padding: 0.65rem 1.25rem;
            background: var(--header-bg);
            border-bottom: 2px solid var(--header-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            cursor: pointer;
        }

        .vridhi-logo-img {
            height: 2.25rem;
            width: 2.25rem;
            max-height: 2.25rem;
            border-radius: 6px;
            background: #ffffff;
            padding: 2px;
            object-fit: contain;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
            flex-shrink: 0;
            display: block;
        }

        .logo-title {
            display: flex;
            flex-direction: column;
        }

        .logo-title h1 {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 1.125rem;
            letter-spacing: -0.01em;
            color: #FFFFFF !important;
            margin: 0;
            line-height: 1.1;
        }

        .logo-title p {
            margin: 0;
            font-size: 0.65rem;
            color: #9CA3AF !important;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .pulse-indicator {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--color-up);
            box-shadow: 0 0 6px var(--color-up);
            display: inline-block;
            animation: pulse-ring 2s infinite ease-in-out;
        }

        @keyframes pulse-ring {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.7; }
        }

        /* Symmetric Mobile Header Overrides matching index.html line 5758 */
        @media (max-width: 768px) {
            .workspace-header {
                height: 48px !important;
                padding: 0 0.6rem !important;
            }
            .header-brand .logo-title {
                display: none !important;
            }
            .vridhi-logo-img {
                width: 1.85rem !important;
                height: 1.85rem !important;
                max-height: 1.85rem !important;
                border-radius: 4px !important;
            }
        }

        /* Main Viewport Container: Flexible, Never Stuck */
        .main-viewport {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            width: 100%;
        }

        /* Zerodha Kite Style Clean Light Card */
        .login-card {
            width: 100%;
            max-width: 380px;
            background: var(--card-bg);
            border-radius: 8px;
            padding: 30px 32px 26px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.04);
            border: 1px solid var(--card-border);
            text-align: left;
        }

        .card-header {
            text-align: center;
            margin-bottom: 22px;
        }

        /* Logo above user name in the card */
        .card-logo {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            background: #ffffff;
            padding: 3px;
            object-fit: contain;
            margin: 0 auto 12px;
            display: block;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            border: 1px solid #E2E8F0;
        }

        .card-title {
            font-size: 22px;
            font-weight: 600;
            color: var(--text-card-title);
            letter-spacing: -0.01em;
            margin-bottom: 4px;
        }

        .card-subtitle {
            font-size: 13px;
            color: var(--text-card-muted);
            font-weight: 400;
        }

        /* Error Notification Banner */
        .error-banner {
            display: none;
            align-items: center;
            gap: 8px;
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            color: var(--error-text);
            padding: 9px 12px;
            border-radius: 4px;
            font-size: 12.5px;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .error-banner svg {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
            fill: var(--error-text);
        }

        /* Form Inputs */
        .form-group {
            margin-bottom: 15px;
        }

        .form-label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-card-muted);
            margin-bottom: 5px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-input {
            width: 100%;
            height: 42px;
            background: #FFFFFF;
            border: 1px solid var(--input-border);
            border-radius: 4px;
            padding: 0 36px 0 12px;
            font-family: inherit;
            font-size: 14px;
            color: var(--text-card-title);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--input-border-focus);
            box-shadow: 0 0 0 2px rgba(255, 87, 34, 0.15);
        }

        .toggle-password {
            position: absolute;
            right: 8px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-card-muted);
            transition: color 0.15s ease;
        }

        .toggle-password:hover {
            color: var(--text-card-title);
        }

        .toggle-password svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* Checkbox & Session Tag */
        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 12px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-card-muted);
            cursor: pointer;
            user-select: none;
        }

        .checkbox-label input[type="checkbox"] {
            accent-color: var(--btn-orange);
            width: 14px;
            height: 14px;
            cursor: pointer;
        }

        .session-badge {
            font-size: 11px;
            color: #475569;
            background: #F1F5F9;
            padding: 2px 7px;
            border-radius: 3px;
            font-weight: 500;
        }

        /* Zerodha-Style Primary Login Button */
        .btn-login {
            width: 100%;
            height: 44px;
            background-color: var(--btn-orange);
            color: #FFFFFF;
            border: none;
            border-radius: 4px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-login:hover {
            background-color: var(--btn-orange-hover);
        }

        .btn-login:active {
            background-color: var(--btn-orange-active);
        }

        .btn-login:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .btn-spinner {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-top-color: #FFFFFF;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Institutional Access Notice */
        .institutional-notice {
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid #F1F5F9;
            text-align: center;
            font-size: 11.5px;
            color: var(--text-card-muted);
            line-height: 1.45;
        }

        .institutional-notice strong {
            color: var(--text-card-body);
            font-weight: 600;
        }

        /* Minimal Single-Line Footer */
        .app-footer {
            width: 100%;
            height: 38px;
            background: var(--footer-bg);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 16px;
            font-size: 11.5px;
            color: #9CA3AF;
            flex-shrink: 0;
            z-index: 100;
            text-align: center;
        }

        .app-footer strong {
            color: #F9FAFB;
        }

        /* Mobile View Ergonomics */
        @media (max-width: 600px) {
            .main-viewport {
                padding: 16px 12px;
            }
            .login-card {
                padding: 22px 18px 18px;
                max-width: 340px;
                box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
            }
            .card-logo {
                width: 44px;
                height: 44px;
                margin-bottom: 10px;
            }
            .card-header {
                margin-bottom: 16px;
            }
            .card-title {
                font-size: 20px;
            }
            .form-group {
                margin-bottom: 12px;
            }
            .form-options {
                margin-bottom: 15px;
            }
            .institutional-notice {
                margin-top: 14px;
                padding-top: 10px;
                font-size: 10.5px;
            }
            .app-footer {
                height: 34px;
                font-size: 10.5px;
            }
        }
    </style>
</head>
<body>

    <!-- Symmetric Top Header: Identical Dimensions & Styling to App Inside -->
    <header class="workspace-header">
        <div class="header-brand" onclick="window.location.href='/login'">
            <picture>
                <source media="(max-width: 768px)" srcset="/branding/vridhi_mobile_logo.jpg?v=4">
                <img src="/branding/vridhi_logo.jpg?v=4" alt="Vridhi Logo" class="vridhi-logo-img">
            </picture>
            <div class="logo-title">
                <h1>VRIDHI</h1>
                <p>
                    <span class="pulse-indicator"></span>
                    <span>LIVE CONNECT</span>
                </p>
            </div>
        </div>
    </header>

    <!-- Main Viewport (Centered Authentication Card, Smooth Native Mobile Pull-to-Refresh) -->
    <main class="main-viewport">
        <div class="login-card">
            
            <div class="card-header">
                <!-- Single Unified Brand Mark Above Username / Title -->
                <img src="/branding/vridhi_logo.jpg?v=4" alt="Vridhi Logo" class="card-logo">
                <h1 class="card-title">Login to Vridhi</h1>
                <p class="card-subtitle">Algorithmic Trading & Execution Console</p>
            </div>

            <!-- Error Banner -->
            <div class="error-banner" id="error-banner" role="alert">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                </svg>
                <span id="error-message">Invalid username or password.</span>
            </div>

            <!-- Login Form -->
            <form id="login-form" onsubmit="handleLoginSubmit(event)" autocomplete="off">
                <div class="form-group">
                    <label class="form-label" for="username">User ID / Username</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" class="form-input" placeholder="admin or username" required autofocus autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" class="form-input" placeholder="Password" required autocomplete="current-password">
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility">
                            <svg id="eye-icon" viewBox="0 0 24 24">
                                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember-me" checked>
                        <span>Keep me signed in</span>
                    </label>
                    <span class="session-badge">12h JWT Session</span>
                </div>

                <button type="submit" class="btn-login" id="submit-btn">
                    <span id="btn-text">Login</span>
                    <div class="btn-spinner" id="btn-spinner"></div>
                </button>
            </form>

            <!-- Institutional Notice -->
            <div class="institutional-notice">
                <strong>Institutional Access Only</strong><br>
                Public registration is disabled. Access is provisioned strictly by system administrators.
            </div>

        </div>
    </main>

    <!-- Footer: Strictly Contains Single Requested Copyright Line -->
    <footer class="app-footer">
        <span>&copy; 2026 <strong>Vridhi Trade Technologies</strong>. All rights reserved.</span>
    </footer>

    <script>
        function togglePasswordVisibility() {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('eye-icon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.innerHTML = '<path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.44-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>';
            } else {
                pwd.type = 'password';
                icon.innerHTML = '<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>';
            }
        }

        async function handleLoginSubmit(e) {
            e.preventDefault();
            const userEl = document.getElementById('username');
            const passEl = document.getElementById('password');
            const btn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');
            const spinner = document.getElementById('btn-spinner');
            const errorBanner = document.getElementById('error-banner');
            const errorMsg = document.getElementById('error-message');

            const username = userEl.value.trim();
            const password = passEl.value;

            if (!username || !password) return;

            // Loading state
            btn.disabled = true;
            btnText.style.display = 'none';
            spinner.style.display = 'block';
            errorBanner.style.display = 'none';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.error || 'Authentication failed. Please check credentials.');
                }

                // If JWT received, store in localStorage as client fallback
                if (data.token) {
                    localStorage.setItem('vridhi_jwt', data.token);
                    localStorage.setItem('vridhi_user', JSON.stringify({
                        username: data.username,
                        role: data.role,
                        id: data.user_id
                    }));
                }

                // Redirect to dashboard
                window.location.href = '/zt';

            } catch (err) {
                errorMsg.innerText = err.message || 'Authentication error. Please try again.';
                errorBanner.style.display = 'flex';
                btn.disabled = false;
                btnText.style.display = 'inline';
                spinner.style.display = 'none';
                passEl.value = '';
                passEl.focus();
            }
        }

        // Auto-focus username on load
        window.addEventListener('DOMContentLoaded', () => {
            const u = document.getElementById('username');
            if (u) u.focus();
        });
    </script>
</body>
</html>
