<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background subtle gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdf2f4"/>
    </radialGradient>

    <!-- App Tile Gradient & Shadow -->
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff5f6"/>
    </linearGradient>
    <filter id="tileShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#be123c" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>

    <!-- Gold Accent Gradient for Trendline & Arrow -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Deep Carmine Rose Linework Gradient -->
    <linearGradient id="roseGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#9f1239"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>

  <!-- Subtle divider between Main Logo and App Icon Tile -->
  <line x1="720" y1="120" x2="720" y2="555" stroke="#fecdd3" stroke-width="1.5" stroke-dasharray="4 6"/>

  <!-- ========================================== -->
  <!-- LEFT SIDE: MAIN LOGO                       -->
  <!-- ========================================== -->
  <g transform="translate(400, 240)">
    <!-- Base Bottom Calyx Petals -->
    <path d="M 0 110 Q -90 145 -180 105 Q -90 90 0 110" fill="none" stroke="#be123c" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 0 110 Q 90 145 180 105 Q 90 90 0 110" fill="none" stroke="#be123c" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 0 110 Q -40 150 0 160 Q 40 150 0 110" fill="none" stroke="#be123c" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Outer Left & Right Petals -->
    <path d="M 0 110 Q -150 85 -195 20 Q -115 15 0 110" fill="none" stroke="#be123c" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 0 110 Q 150 85 195 20 Q 115 15 0 110" fill="none" stroke="#be123c" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Mid Left & Right Petals -->
    <path d="M 0 110 Q -120 30 -115 -60 Q -45 -15 0 110" fill="none" stroke="#be123c" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 0 110 Q 120 30 115 -60 Q 45 -15 0 110" fill="none" stroke="#be123c" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- ==================================================== -->
    <!-- CENTRAL OVAL PETAL (PERFECTLY SYMMETRICAL)           -->
    <!-- ==================================================== -->
    <path d="M 0 110 C -65 40 -65 -65 0 -115 C 65 -65 65 40 0 110 Z" 
          fill="rgba(190, 18, 60, 0.03)" stroke="#be123c" stroke-width="5" stroke-linejoin="round"/>

    <!-- ==================================================== -->
    <!-- MARKET MOVING TREND: UP - DOWN - UP (STRICTLY INSIDE) -->
    <!-- ==================================================== -->
    <!-- Trendline Path with subtle warm glow -->
    <path d="M -22 62 L -5 -5 L 8 22 L 26 -65" 
          fill="none" stroke="rgba(217, 119, 6, 0.2)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -22 62 L -5 -5 L 8 22 L 26 -65" 
          fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Arrowhead at (26, -65) pointing Upwards -->
    <polygon points="26,-80 16,-60 36,-60" fill="url(#goldGrad)"/>

    <!-- Circular market price nodes at the 4 points -->
    <circle cx="-22" cy="62" r="4.5" fill="#d97706"/>
    <circle cx="-5" cy="-5" r="4.5" fill="#f59e0b"/>
    <circle cx="8" cy="22" r="4.5" fill="#f59e0b"/>
    <circle cx="26" cy="-65" r="4.5" fill="#fbbf24"/>

    <!-- Subtitle / Brand Typography -->
    <text x="0" y="215" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="12" fill="#be123c">VRIDHI</text>
    <text x="0" y="246" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="4" fill="#9f1239">ALGORITHMIC TRADING</text>
  </g>

  <!-- ========================================== -->
  <!-- RIGHT SIDE: STANDALONE APP FAVICON / TILE  -->
  <!-- ========================================== -->
  <g transform="translate(950, 310)">
    <!-- App Tile Box with Squircle Corner Radius -->
    <rect x="-130" y="-130" width="260" height="260" rx="58" fill="url(#tileGrad)" stroke="#fecdd3" stroke-width="2" filter="url(#tileShadow)"/>

    <!-- Scaled Lotus & Trend Icon inside Tile -->
    <g transform="scale(0.58) translate(0, -10)">
      <!-- Base Bottom Calyx Petals -->
      <path d="M 0 110 Q -90 145 -180 105 Q -90 90 0 110" fill="none" stroke="#be123c" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 0 110 Q 90 145 180 105 Q 90 90 0 110" fill="none" stroke="#be123c" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 0 110 Q -40 150 0 160 Q 40 150 0 110" fill="none" stroke="#be123c" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Outer Left & Right Petals -->
      <path d="M 0 110 Q -150 85 -195 20 Q -115 15 0 110" fill="none" stroke="#be123c" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 0 110 Q 150 85 195 20 Q 115 15 0 110" fill="none" stroke="#be123c" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Mid Left & Right Petals -->
      <path d="M 0 110 Q -120 30 -115 -60 Q -45 -15 0 110" fill="none" stroke="#be123c" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 0 110 Q 120 30 115 -60 Q 45 -15 0 110" fill="none" stroke="#be123c" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Central Oval Petal -->
      <path d="M 0 110 C -65 40 -65 -65 0 -115 C 65 -65 65 40 0 110 Z" 
            fill="rgba(190, 18, 60, 0.04)" stroke="#be123c" stroke-width="6" stroke-linejoin="round"/>

      <!-- Market Trend Line: UP - DOWN - UP inside central oval -->
      <path d="M -22 62 L -5 -5 L 8 22 L 26 -65" 
            fill="none" stroke="rgba(217, 119, 6, 0.25)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M -22 62 L -5 -5 L 8 22 L 26 -65" 
          fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <polygon points="26,-80 16,-60 36,-60" fill="url(#goldGrad)"/>

      <!-- Circular Nodes -->
      <circle cx="-22" cy="62" r="5" fill="#d97706"/>
      <circle cx="-5" cy="-5" r="5" fill="#f59e0b"/>
      <circle cx="8" cy="22" r="5" fill="#f59e0b"/>
      <circle cx="26" cy="-65" r="5" fill="#fbbf24"/>
    </g>

    <!-- App Icon Label below Tile -->
    <text x="0" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#be123c">APP ICON / FAVICON</text>
  </g>
</svg>
